<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }

        #lobby {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }

        #lobby input { width: 6rem; padding: 0.35rem; }
        #lobby button { padding: 0.35rem 0.75rem; cursor: pointer; }
        #lobby-status { font-size: 0.875rem; color: #444; }
    </style>
</head>
<body>
    <div id="lobby">
        <button id="create-btn">Create lobby</button>
        <input id="lobby-num" placeholder="code" autocomplete="off">
        <button id="join-btn">Join lobby</button>
        <span id="lobby-status">Connecting...</span>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
